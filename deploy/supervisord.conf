[unix_http_server]
file=/root/autodl-tmp/rick-ppt/deploy/private/supervisor.sock
chmod=0600

[supervisord]
logfile=/root/autodl-tmp/rick-ppt/deploy/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/root/autodl-tmp/rick-ppt/deploy/private/supervisord.pid
childlogdir=/root/autodl-tmp/rick-ppt/deploy/logs
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/rick-ppt/deploy/private/supervisor.sock

[program:pptx-proxy]
command=/root/miniconda3/bin/python3 -u /root/autodl-tmp/rick-ppt/deploy/keep_proxy.py
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/root/autodl-tmp/rick-ppt/deploy/logs/proxy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:pptx-worker]
command=/root/autodl-tmp/rick-ppt/.venv/bin/python -u /root/autodl-tmp/rick-ppt/runner/runner.py
directory=/root/autodl-tmp/rick-ppt/runner
environment=PATH="/root/autodl-tmp/rick-ppt/deploy/bin:/usr/local/bin:/usr/bin:/bin",LANG="C.UTF-8",HTTP_PROXY="http://127.0.0.1:7890",HTTPS_PROXY="http://127.0.0.1:7890",ALL_PROXY="socks5h://127.0.0.1:7890",NO_PROXY="localhost,127.0.0.1,::1",PPTX_RUNNER_SETTINGS="/root/autodl-tmp/rick-ppt/runner/settings.local.json"
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stopwaitsecs=10800
stopasgroup=false
killasgroup=false
stdout_logfile=/root/autodl-tmp/rick-ppt/deploy/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
