name: Native PPTX and website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
          python -m venv pptx-agent/.venv
          pptx-agent/.venv/bin/python -m pip install -e 'pptx-agent[test]'
      - name: Native tool and render checks
        working-directory: pptx-agent
        run: .venv/bin/python -m pytest -q --tb=short
      - name: Durable workflow and conversation boundaries
        run: |
          pptx-agent/.venv/bin/python -m unittest discover -s workflow -p 'test_*.py'
          pptx-agent/.venv/bin/python runner/test-conversation.py
          pptx-agent/.venv/bin/python runner/test-recovery-workspace.py
          pptx-agent/.venv/bin/python runner/test-content-workflow.py
          pptx-agent/.venv/bin/python runner/test-review-sessions.py
          pptx-agent/.venv/bin/python runner/test-repair-recovery.py
          pptx-agent/.venv/bin/python runner/test-draft-progress.py
          pptx-agent/.venv/bin/python runner/test-model-backend.py
          pptx-agent/.venv/bin/python runner/test-chat-protocol.py
          pptx-agent/.venv/bin/python runner/test-chat-proxy.py
          pptx-agent/.venv/bin/python runner/test-installed-hooks.py
          pptx-agent/.venv/bin/python runner/test-update-plugin.py
          pptx-agent/.venv/bin/python runner/test-acceptance-migration.py
          pptx-agent/.venv/bin/python runner/test-inspect-case-artifacts.py
          pptx-agent/.venv/bin/python runner/test-review.py
          pptx-agent/.venv/bin/python runner/test-native-editor.py
          pptx-agent/.venv/bin/python runner/test-canvas-snapshot.py
          pptx-agent/.venv/bin/python runner/test-user-pages.py
          pptx-agent/.venv/bin/python runner/test-public-review.py
          pptx-agent/.venv/bin/python runner/test-renderer-health.py
          pptx-agent/.venv/bin/python runner/test-service-watchdog.py
      - name: Build and verify the portable Skill
        run: |
          pptx-agent/.venv/bin/python tools/build-skill.py --output "$RUNNER_TEMP/rick-pptx"
          pptx-agent/.venv/bin/python "$RUNNER_TEMP/rick-pptx/rick-pptx/scripts/doctor.py"
  website-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci --prefix website
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Prepare synthetic native editor fixtures without model calls
        run: |
          python -m pip install lxml Pillow
          python runner/test-native-editor.py --fixtures "$RUNNER_TEMP/rickppt-native"
          python runner/test-user-pages.py --fixtures "$RUNNER_TEMP/rickppt-progressive"
      - name: Conversation, recovery and read-only delivery routes
        working-directory: website
        run: |
          node --experimental-strip-types --test scripts/test-conversation.mjs
          node --experimental-strip-types --test scripts/test-worker-recovery.mjs
          node --experimental-strip-types --test scripts/test-review-bundle.mjs
          node scripts/test-native-edits.mjs "$RUNNER_TEMP/rickppt-native"
          node scripts/test-progressive-edits.mjs "$RUNNER_TEMP/rickppt-progressive"
          node scripts/test-review-results.mjs
          node scripts/test-review-results-ui.mjs
          node scripts/test-task-controls-ui.mjs
          node scripts/test-case-gallery.mjs
          npx tsc --noEmit
      - name: Build the website without production credentials
        working-directory: website
        run: npm run build
